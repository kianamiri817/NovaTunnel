          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tauriScript: pnpm tauri
          args: --target aarch64-unknown-linux-gnu

      - name: Generate checksums (Linux ARM64)
        run: |
          BUNDLE_PATH="src-tauri/target/aarch64-unknown-linux-gnu/release/bundle"
          cd "$BUNDLE_PATH"
          
          CHECKSUMS256=""
          CHECKSUMS512=""
          
          for dir in appimage deb tar.gz; do
            if [ -d "$dir" ]; then
              for file in "$dir"/*; do
                if [ -f "$file" ]; then
                  HASH256=$(sha256sum "$file" | cut -d' ' -f1)
                  HASH512=$(sha512sum "$file" | cut -d' ' -f1)
                  CHECKSUMS256="$CHECKSUMS256$HASH256  $(basename $file)\n"
                  CHECKSUMS512="$CHECKSUMS512$HASH512  $(basename $file)\n"
                fi
              done
            fi
          done
          
          echo -e "$CHECKSUMS256" > SHA256SUMS.txt
          echo -e "$CHECKSUMS512" > SHA512SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novatunnel-linux-arm64
          path: |
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/**/*.AppImage
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/**/*.deb
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/**/*.tar.gz
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/**/SHA256SUMS.txt
            src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/**/SHA512SUMS.txt
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-linux-arm64
          path: |
            src-tauri/target/aarch64-unknown-linux-gnu/release/build/*/output
          retention-days: 30

