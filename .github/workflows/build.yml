  # ============================================================================
  # Generate Reports Job
  # ============================================================================
  reports:
    name: Generate Reports
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-reports-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate dependency tree
        run: cargo tree > dependency-tree.txt

      - name: Generate audit report
        run: |
          cargo install cargo-audit
          cargo audit --json > audit-report.json 2>/dev/null || true
          cargo audit > audit-report.txt 2>/dev/null || true

      - name: Generate license report
        run: |
          cargo install cargo-deny
          cargo deny list > license-report.txt 2>/dev/null || true

      - name: Generate build duration report
        run: |
          echo "Build Duration Report" > build-duration.txt
          echo "Generated at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> build-duration.txt
          echo "Workflow: ${{ github.workflow }}" >> build-duration.txt
          echo "Run ID: ${{ github.run_id }}" >> build-duration.txt

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            dependency-tree.txt
            audit-report.json
            audit-report.txt
            license-report.txt
            build-duration.txt
          retention-days: 30

  # ============================================================================
  # Verify & Publish Job
  # ============================================================================
  verify-and-publish:
    name: Verify & Publish
    needs: [
      build-windows-x64,
      build-windows-arm64,
      build-linux-x64,
      build-linux-arm64,
      build-macos-intel,
      build-macos-apple-silicon,
      reports
    ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: novatunnel-*
          merge-multiple: false

      - name: Download debug symbols
        uses: actions/download-artifact@v4
        with:
          path: artifacts/debug
          merge-multiple: true
          pattern: debug-symbols-*

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: artifacts/reports
          merge-multiple: true
          pattern: build-reports

      - name: Download binary sizes
        uses: actions/download-artifact@v4
        with:
          path: artifacts/sizes
          merge-multiple: true
          pattern: binary-sizes-*

      - name: Verify all artifacts exist
        run: |
          echo "=== Verifying Build Artifacts ==="
          find artifacts -type f | head -100
          
          # Verify at least one binary exists per platform
          PLATFORMS=("windows-x64" "windows-arm64" "linux-x64" "linux-arm64" "macos-intel" "macos-apple-silicon")
          for platform in "${PLATFORMS[@]}"; do
            if ! find artifacts -path "*novatunnel-$platform*" -type f | grep -q .; then
              echo "Warning: No artifacts found for $platform"
            else
              echo "OK: $platform artifacts found"
            fi
          done

      - name: Verify SHA256 checksums
        run: |
          echo "=== Verifying SHA256 Checksums ==="
          find artifacts -name "SHA256SUMS.txt" -exec sh -c '
            echo "Verifying: $1"
            cd "$(dirname "$1")"
            sha256sum -c "$(basename "$1")" || echo "Checksum verification failed for $1"
          ' _ {} \;

      - name: Create consolidated checksums
        run: |
          mkdir -p release
          find artifacts -name "SHA256SUMS.txt" -exec cat {} \; > release/SHA256SUMS.txt
          find artifacts -name "SHA512SUMS.txt" -exec cat {} \; > release/SHA512SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat release/SHA256SUMS.txt
          echo ""
          echo "=== SHA512SUMS.txt ==="
          cat release/SHA512SUMS.txt

      - name: Generate SBOM
        run: |
          # Install syft for SBOM generation
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          
          # Generate SBOM for source
          syft dir:. -o spdx-json=sbom-source.spdx.json -o cyclonedx=sbom-source.cyclonedx.json || true
          
          # Generate SBOM for binaries
          find artifacts -type f \( -name "*.exe" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.deb" \) -exec sh -c '
            for file; do
              syft "$file" -o spdx-json="sbom-$(basename "$file").spdx.json" || true
            done
          ' _ {} \;

      - name: Generate SLSA provenance
        uses: slsa-framework/slsa-github-generator@v1.4.0
        with:
          base64-subjects: "${{ needs.build-windows-x64.outputs.subjects }}"
          upload-assets: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Generate build attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'artifacts/**/*'
        continue-on-error: true

      - name: Determine release type
        id: release_type
        run: |
          TAG="${{ github.ref_name }}"
          IS_PRERELEASE="false"
          IS_DRAFT="false"
          
          if echo "$TAG" | grep -qE '(alpha|beta|rc)'; then
            IS_PRERELEASE="true"
            IS_DRAFT="true"
          fi
          
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "is_draft=$IS_DRAFT" >> $GITHUB_OUTPUT

      - name: Generate categorized release notes
        id: release_notes
        run: |
          # Get previous tag
          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          CURRENT_TAG="${{ github.ref_name }}"
          
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$CURRENT_TAG" ]; then
            RANGE="$PREV_TAG..$CURRENT_TAG"
          else
            RANGE="-20"
          fi
          
          # Categorize commits
          FEATURES=$(git log --pretty=format:"- %s (%h)" $RANGE | grep -iE '^(feat|feature|add|new)' || echo "- No features")
          FIXES=$(git log --pretty=format:"- %s (%h)" $RANGE | grep -iE '^(fix|bug|patch|resolve)' || echo "- No fixes")
          PERFORMANCE=$(git log --pretty=format:"- %s (%h)" $RANGE | grep -iE '^(perf|performance|optimize|speed)' || echo "- No performance improvements")
          SECURITY=$(git log --pretty=format:"- %s (%h)" $RANGE | grep -iE '^(security|vuln|cve|auth)' || echo "- No security updates")
          DOCS=$(git log --pretty=format:"- %s (%h)" $RANGE | grep -iE '^(doc|docs|readme|comment)' || echo "- No documentation changes")
          BREAKING=$(git log --pretty=format:"- %s (%h)" $RANGE | grep -iE '^(breaking|BREAKING)' || echo "- No breaking changes")
          OTHER=$(git log --pretty=format:"- %s (%h)" $RANGE | grep -viE '^(feat|feature|add|new|fix|bug|patch|resolve|perf|performance|optimize|speed|security|vuln|cve|auth|doc|docs|readme|comment|breaking|BREAKING|chore|ci|build|test|refactor|style)' || echo "- No other changes")
          
          cat > /tmp/release_notes.md << 'NOTES_EOF'
          ## NovaTunnel ${{ github.ref_name }}
          
          ### 🚀 Features
          $FEATURES
          
          ### 🐛 Fixes
          $FIXES
          
          ### ⚡ Performance
          $PERFORMANCE
          
          ### 🔒 Security
          $SECURITY
          
          ### 📚 Documentation
          $DOCS
          
          ### ⚠️ Breaking Changes
          $BREAKING
          
          ### 📦 Other Changes
          $OTHER
          
          ### 🔐 Verification
          Download `SHA256SUMS.txt` and verify checksums:
          ```bash
          sha256sum -c SHA256SUMS.txt
          ```
          
          ### 📋 SBOM
          Software Bill of Materials (SBOM) files are attached for supply chain transparency.
          NOTES_EOF
          
          cat /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: NovaTunnel ${{ github.ref_name }}
          draft: ${{ steps.release_type.outputs.is_draft }}
          prerelease: ${{ steps.release_type.outputs.is_prerelease }}
          generate_release_notes: true
          body_path: /tmp/release_notes.md
          files: |
            artifacts/novatunnel-windows-x64/**/*.exe
            artifacts/novatunnel-windows-x64/**/*.msi
            artifacts/novatunnel-windows-arm64/**/*.exe
            artifacts/novatunnel-linux-x64/**/*.AppImage
            artifacts/novatunnel-linux-x64/**/*.deb
            artifacts/novatunnel-linux-x64/**/*.tar.gz
            artifacts/novatunnel-linux-arm64/**/*.AppImage
            artifacts/novatunnel-linux-arm64/**/*.deb
            artifacts/novatunnel-macos-intel/**/*.dmg
            artifacts/novatunnel-macos-apple-silicon/**/*.dmg
            release/SHA256SUMS.txt
            release/SHA512SUMS.txt
            sbom-*.spdx.json
            sbom-*.cyclonedx.json
            artifacts/debug/**/*
            artifacts/reports/**/*
            artifacts/sizes/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Retry release upload on failure
        if: failure()
        uses: softprops/action-gh-release@v1
        with:
          name: NovaTunnel ${{ github.ref_name }}
          draft: ${{ steps.release_type.outputs.is_draft }}
          prerelease: ${{ steps.release_type.outputs.is_prerelease }}
          generate_release_notes: true
          body_path: /tmp/release_notes.md
          files: |
            artifacts/novatunnel-windows-x64/**/*.exe
            artifacts/novatunnel-linux-x64/**/*.AppImage
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        if: steps.release_type.outputs.is_draft == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 5
            });
            
            const draftRelease = releases.data.find(r => r.draft && r.tag_name === context.ref.replace('refs/tags/', ''));
            
            if (draftRelease) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draftRelease.id,
                draft: false
              });
              console.log(`Published release: ${draftRelease.tag_name}`);
            }

      - name: Clean up old releases
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 20
            });
            
            const tagReleases = releases.data.filter(r => r.tag_name.startsWith('v') && !r.draft);
            
            if (tagReleases.length > 10) {
              const toDelete = tagReleases.slice(10);
              for (const release of toDelete) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id
                });
                console.log(`Deleted release: ${release.tag_name}`);
              }
            }
