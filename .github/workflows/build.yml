        with:
          tauriScript: pnpm tauri
          args: --target x86_64-apple-darwin

      - name: Generate checksums (macOS Intel)
        run: |
          BUNDLE_PATH="src-tauri/target/x86_64-apple-darwin/release/bundle"
          cd "$BUNDLE_PATH"
          
          CHECKSUMS256=""
          CHECKSUMS512=""
          
          for file in dmg/*.dmg dmg/*.app; do
            if [ -f "$file" ]; then
              HASH256=$(shasum -a 256 "$file" | cut -d' ' -f1)
              HASH512=$(shasum -a 512 "$file" | cut -d' ' -f1)
              CHECKSUMS256="$CHECKSUMS256$HASH256  $(basename $file)\n"
              CHECKSUMS512="$CHECKSUMS512$HASH512  $(basename $file)\n"
            fi
          done
          
          echo -e "$CHECKSUMS256" > SHA256SUMS.txt
          echo -e "$CHECKSUMS512" > SHA512SUMS.txt

      - name: Collect debug symbols
        run: |
          mkdir -p debug-symbols
          TARGET_DIR="src-tauri/target/x86_64-apple-darwin/release"
          find "$TARGET_DIR" -name "*.dSYM" -exec cp -r {} debug-symbols/ \; 2>/dev/null || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novatunnel-macos-intel
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/**/SHA256SUMS.txt
            src-tauri/target/x86_64-apple-darwin/release/bundle/**/SHA512SUMS.txt
          retention-days: 30

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-macos-intel
          path: debug-symbols/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-macos-intel
          path: |
            src-tauri/target/x86_64-apple-darwin/release/build/*/output
          retention-days: 30

