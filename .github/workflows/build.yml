      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novatunnel-windows-arm64
          path: |
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/**/*.exe
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/**/SHA256SUMS.txt
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/**/SHA512SUMS.txt
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows-arm64
          path: |
            src-tauri/target/aarch64-pc-windows-msvc/release/build/*/output
          retention-days: 30

  # ============================================================================
  # Build Job - Linux x64
  # ============================================================================
  build-linux-x64:
    name: Build Linux x64
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/cache
          key: ${{ runner.os }}-cargo-cache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cache-

      - name: Cache Cargo git
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-cargo-target-release-x64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-release-x64-

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Linux dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update && break || sleep 5
          done
          for i in 1 2 3; do
            sudo apt-get install -y \
              libwebkit2gtk-4.0-dev \
              libgtk-3-dev \
              libappindicator3-dev \
              librsvg2-dev \
              patchelf \
              libssl-dev \
              libayatana-appindicator3-dev && break || sleep 5
          done

      - name: Install UI dependencies
        working-directory: ui
        run: |
          for i in 1 2 3; do
            pnpm install --frozen-lockfile && break || sleep 5
          done

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tauriScript: pnpm tauri
          args: --target x86_64-unknown-linux-gnu

      - name: Generate checksums (Linux x64)
        run: |
          BUNDLE_PATH="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"
          cd "$BUNDLE_PATH"
          
          CHECKSUMS256=""
          CHECKSUMS512=""
          
          for dir in appimage deb tar.gz; do
            if [ -d "$dir" ]; then
              for file in "$dir"/*; do
                if [ -f "$file" ]; then
                  HASH256=$(sha256sum "$file" | cut -d' ' -f1)
                  HASH512=$(sha512sum "$file" | cut -d' ' -f1)
                  CHECKSUMS256="$CHECKSUMS256$HASH256  $(basename $file)\n"
                  CHECKSUMS512="$CHECKSUMS512$HASH512  $(basename $file)\n"
                fi
              done
            fi
          done
          
          echo -e "$CHECKSUMS256" > SHA256SUMS.txt
          echo -e "$CHECKSUMS512" > SHA512SUMS.txt

      - name: Collect debug symbols
        run: |
          mkdir -p debug-symbols
          TARGET_DIR="src-tauri/target/x86_64-unknown-linux-gnu/release"
          find "$TARGET_DIR" -name "*.debug" -exec cp {} debug-symbols/ \; 2>/dev/null || true
          find "$TARGET_DIR" -name "*.dwp" -exec cp {} debug-symbols/ \; 2>/dev/null || true

      - name: Collect binary sizes
        run: |
          BUNDLE_PATH="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"
          find "$BUNDLE_PATH" -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.tar.gz" \) -exec stat --format="%n %s bytes" {} \; > binary-sizes-linux-x64.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novatunnel-linux-x64
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/*.tar.gz
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/SHA256SUMS.txt
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/**/SHA512SUMS.txt
          retention-days: 30

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-linux-x64
          path: debug-symbols/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload binary sizes
        uses: actions/upload-artifact@v4
        with:
          name: binary-sizes-linux-x64
          path: binary-sizes-linux-x64.txt
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-linux-x64
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/build/*/output
          retention-days: 30

