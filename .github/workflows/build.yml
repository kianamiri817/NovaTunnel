      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-cargo-target-release-arm64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-release-arm64-

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tauriScript: pnpm tauri
          args: --target aarch64-pc-windows-msvc

      - name: Generate checksums (Windows ARM64)
        shell: pwsh
        run: |
          $bundlePath = "src-tauri/target/aarch64-pc-windows-msvc/release/bundle"
          $checksums256 = @()
          $checksums512 = @()
          
          if (Test-Path "$bundlePath/nsis") {
            Get-ChildItem "$bundlePath/nsis/*.exe" | ForEach-Object {
              $hash256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
              $hash512 = (Get-FileHash $_.FullName -Algorithm SHA512).Hash
              $checksums256 += "$hash256  $($_.Name)"
