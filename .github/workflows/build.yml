name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        required: false
        default: 'false'
        type: boolean
      debug_build:
        description: 'Build in debug mode'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: stable
  NODE_VERSION: '20'
  PNPM_VERSION: '8'
  CARGO_INCREMENTAL: 1

permissions:
  contents: write
  security-events: write
  id-token: write
  attestations: write

jobs:
  # ============================================================================
  # Version Injection Job
  # ============================================================================
  prepare:
    name: Prepare Release
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      is_release: ${{ steps.version.outputs.is_release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          IS_RELEASE="false"
          IS_PRERELEASE="false"
          
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="${TAG#v}"
            IS_RELEASE="true"
            if echo "$VERSION" | grep -qE '(alpha|beta|rc|dev)'; then
              IS_PRERELEASE="true"
            fi
          else
            VERSION="0.0.0-dev"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          
          echo "Version: $VERSION"
          echo "Is Release: $IS_RELEASE"
          echo "Is Pre-release: $IS_PRERELEASE"

      - name: Inject version into Cargo.toml
        if: steps.version.outputs.is_release == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Updating Cargo.toml to version $VERSION"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" core/Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" app/Cargo.toml
          cat Cargo.toml | grep "^version"

      - name: Inject version into package.json
        if: steps.version.outputs.is_release == 'true'
        working-directory: ui
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Updating package.json to version $VERSION"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          cat package.json | grep "\"version\""

      - name: Inject version into tauri.conf.json
        if: steps.version.outputs.is_release == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Updating tauri.conf.json to version $VERSION"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" app/tauri.conf.json
          cat app/tauri.conf.json | grep "\"version\""

      - name: Commit version changes
        if: steps.version.outputs.is_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git push || echo "Push failed, continuing with build"

  # ============================================================================
  # Lint & Security Audit Job
  # ============================================================================
  lint:
    name: Lint & Audit
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Rust lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run license compliance check
        run: cargo deny check licenses

      - name: Generate audit report
        run: cargo audit --json > audit-report.json 2>/dev/null || true

      - name: Generate license report
        run: cargo deny list > license-report.txt 2>/dev/null || true

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            audit-report.json
            license-report.txt
          retention-days: 30

  # ============================================================================
  # Build Job - Windows x64
  # ============================================================================
  build-windows-x64:
    name: Build Windows x64
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/cache
          key: ${{ runner.os }}-cargo-cache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cache-

      - name: Cache Cargo git
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-cargo-target-release-x64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-release-x64-

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Setup code signing (optional)
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            $cert = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
            $certPath = Join-Path $env:RUNNER_TEMP "certificate.pfx"
            [IO.File]::WriteAllBytes($certPath, $cert)
            echo "CERTIFICATE_PATH=$certPath" >> $env:GITHUB_OUTPUT
            echo "CODE_SIGNING=true" >> $env:GITHUB_OUTPUT
          }

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tauriScript: pnpm tauri
          args: --target x86_64-pc-windows-msvc

      - name: Verify Windows binaries
        shell: pwsh
        run: |
          $bundlePath = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          if (Test-Path "$bundlePath/nsis") {
            Get-ChildItem "$bundlePath/nsis/*.exe" | ForEach-Object {
              $size = $_.Length
              if ($size -lt 1MB) {
                Write-Error "Binary too small: $($_.Name) ($size bytes)"
                exit 1
              }
              Write-Host "Verified: $($_.Name) ($size bytes)"
            }
          }

      - name: Generate checksums (Windows)
        shell: pwsh
        run: |
          $bundlePath = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $checksums256 = @()
          $checksums512 = @()
          
          if (Test-Path "$bundlePath/nsis") {
            Get-ChildItem "$bundlePath/nsis/*.exe" | ForEach-Object {
              $hash256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
              $hash512 = (Get-FileHash $_.FullName -Algorithm SHA512).Hash
              $checksums256 += "$hash256  $($_.Name)"
              $checksums512 += "$hash512  $($_.Name)"
              Write-Host "SHA256: $hash256  $($_.Name)"
            }
          }
          
          $checksums256 | Out-File -FilePath "$bundlePath/SHA256SUMS.txt" -Encoding utf8
          $checksums512 | Out-File -FilePath "$bundlePath/SHA512SUMS.txt" -Encoding utf8

      - name: Collect debug symbols
        shell: pwsh
        run: |
          $debugDir = "debug-symbols"
          New-Item -ItemType Directory -Force -Path $debugDir
          $targetDir = "src-tauri/target/x86_64-pc-windows-msvc/release"
          if (Test-Path "$targetDir/*.pdb") {
            Copy-Item "$targetDir/*.pdb" $debugDir -ErrorAction SilentlyContinue
          }

      - name: Collect binary sizes
        shell: pwsh
        run: |
          $bundlePath = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $sizes = @()
          if (Test-Path "$bundlePath/nsis") {
            Get-ChildItem "$bundlePath/nsis/*.exe" | ForEach-Object {
              $sizes += "$($_.Name) $($_.Length) bytes"
            }
          }
          $sizes | Out-File -FilePath "binary-sizes-windows-x64.txt" -Encoding utf8

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novatunnel-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/SHA256SUMS.txt
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/SHA512SUMS.txt
          retention-days: 30

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-windows-x64
          path: debug-symbols/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload binary sizes
        uses: actions/upload-artifact@v4
        with:
          name: binary-sizes-windows-x64
          path: binary-sizes-windows-x64.txt
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/build/*/output
          retention-days: 30

  # ============================================================================
  # Build Job - Windows ARM64
  # ============================================================================
  build-windows-arm64:
    name: Build Windows ARM64
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout repository
