name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/index
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/cache
          key: ${{ runner.os }}-cargo-cache-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cache-

      - name: Cache Cargo git
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Cache Rust target
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Linux dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev

      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Install Tauri CLI
        working-directory: app
        run: pnpm install

      - name: Build frontend
        working-directory: ui
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Rust lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          projectPath: app

      - name: Generate checksums
        shell: bash
        run: |
          mkdir -p release
          BUNDLE_DIR="app/src-tauri/target/release/bundle"
          if [ -d "$BUNDLE_DIR" ]; then
            cd "$BUNDLE_DIR"
            for f in $(find . -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.tar.gz" -o -name "*.dmg" \)); do
              if command -v sha256sum &> /dev/null; then
                sha256sum "$f" >> "$GITHUB_WORKSPACE/release/SHA256SUMS.txt"
              elif command -v shasum &> /dev/null; then
                shasum -a 256 "$f" >> "$GITHUB_WORKSPACE/release/SHA256SUMS.txt"
              fi
            done
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novatunnel-${{ matrix.platform }}
          path: |
            app/src-tauri/target/release/bundle/**/*.exe
            app/src-tauri/target/release/bundle/**/*.msi
            app/src-tauri/target/release/bundle/**/*.AppImage
            app/src-tauri/target/release/bundle/**/*.deb
            app/src-tauri/target/release/bundle/**/*.tar.gz
            app/src-tauri/target/release/bundle/**/*.dmg
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.platform }}
          path: |
            app/src-tauri/target/release/build/*/output
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create consolidated checksums
        run: |
          mkdir -p release
          find artifacts -name "SHA256SUMS.txt" -exec cat {} \; > release/SHA256SUMS.txt 2>/dev/null || true
          echo "=== Checksums ==="
          cat release/SHA256SUMS.txt 2>/dev/null || echo "No checksums found"

      - name: Determine release type
        id: release_type
        run: |
          TAG="${{ github.ref_name }}"
          IS_PRERELEASE="false"
          IS_DRAFT="false"
          
          if echo "$TAG" | grep -qE '(alpha|beta|rc)'; then
            IS_PRERELEASE="true"
            IS_DRAFT="true"
          fi
          
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "is_draft=$IS_DRAFT" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          CURRENT_TAG="${{ github.ref_name }}"
          
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$CURRENT_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG".."$CURRENT_TAG")
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" -20)
          fi
          
          echo "$NOTES" > /tmp/release_notes.txt
          
          {
            echo "notes<<EOF"
            cat /tmp/release_notes.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: NovaTunnel ${{ github.ref_name }}
          draft: ${{ steps.release_type.outputs.is_draft }}
          prerelease: ${{ steps.release_type.outputs.is_prerelease }}
          generate_release_notes: true
          body: |
            ## NovaTunnel ${{ github.ref_name }}
            
            ### Changes
            ${{ steps.release_notes.outputs.notes }}
            
            ### Verification
            Download `SHA256SUMS.txt` and verify checksums:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.tar.gz
            artifacts/**/*.dmg
            release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
