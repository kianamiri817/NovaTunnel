[workspace]
members = ["core", "app"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["NovaTunnel Team"]
license = "MIT"
description = "Next-generation secure tunneling platform"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.5"
parking_lot = "0.12"
dashmap = "5.5"

# Release profile optimizations
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
